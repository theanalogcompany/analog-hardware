[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; UART bridge, not native USB -> CDC off or Serial goes nowhere
; PSRAM needed for the GxEPD2 framebuffer
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM

; E1002 has 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library